{% extends 'base.html' %}
{% block content %}
<h3>{{ 'Edit Client' if client else 'New Client' }}</h3>

<form method="post" class="row g-3">
  <div class="col-md-6">
    <label class="form-label">Name</label>
    <input type="text" name="name" class="form-control" value="{{ client.name if client else '' }}" required>
  </div>

  <div class="col-md-6">
    <label class="form-label">Phone Number (WhatsApp)</label>
    <input type="text" name="phone" class="form-control" value="{{ client.phone if client else '' }}" placeholder="e.g. 919876543210">
    <div class="form-text">Include country code (e.g. 91 for India)</div>
  </div>

  <div class="col-md-6">
    <label class="form-label">Opening Balance (₹)</label>
    <input type="number" step="0.01" name="opening_balance" class="form-control" value="{{ client.opening_balance if client else 0.0 }}">
    <div class="form-text">Positive for Receivable, Negative for Payable</div>
  </div>

  <div class="col-12">
    <label class="form-label">Address (optional)</label>
    <textarea name="address" class="form-control" rows="3">{{ client.address if client else '' }}</textarea>
  </div>
  
  <div class="col-md-3">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" name="is_client" id="isClient" {% if not client or client.is_client %}checked{% endif %}>
      <label class="form-check-label" for="isClient">
        Is Client (Buyer)
      </label>
    </div>
  </div>
  
  <div class="col-md-3">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" name="is_vendor" id="isVendor" {% if client and client.is_vendor %}checked{% endif %}>
      <label class="form-check-label" for="isVendor">
        Is Vendor (Supplier)
      </label>
    </div>
  </div>
  
  <div class="col-md-3">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" name="is_other" id="isOther" {% if client and client.is_other %}checked{% endif %}>
      <label class="form-check-label" for="isOther">
        Is Other
      </label>
    </div>
  </div>
  
  <div class="col-md-3">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" name="is_active" id="isActive" {% if not client or client.is_active %}checked{% endif %}>
      <label class="form-check-label" for="isActive">
        Active Party
      </label>
    </div>
  </div>

  <div class="col-12">
    <button class="btn btn-primary">Save</button>
    <a class="btn btn-secondary" href="{{ url_for('clients_list') }}">Cancel</a>
  </div>
</form>
{% endblock %}
