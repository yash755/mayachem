{% extends "base.html" %}
{% block title %}{{ 'Edit' if expense else 'Add' }} Credit Card Expense{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="d-flex align-items-center mb-4">
            <a href="{{ url_for('cc_expenses_list') }}" class="btn btn-light me-3"><i class="bi bi-arrow-left"></i></a>
            <h3 class="mb-0">{{ 'Edit' if expense else 'Add' }} Credit Card Expense</h3>
        </div>

        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-md-5">
                <form method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">Bank Name *</label>
                            <input type="text" name="card_bank" class="form-control" required placeholder="e.g. HDFC" value="{{ expense.card_bank if expense else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">Card Last 4 *</label>
                            <input type="text" name="card_last4" class="form-control" required placeholder="e.g. 1234" maxlength="4" value="{{ expense.card_last4 if expense else '' }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">Amount *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">₹</span>
                                <input type="number" step="0.01" name="amount" class="form-control border-start-0" required value="{{ expense.amount if expense else '' }}">
                            </div>
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">Date *</label>
                            <input type="date" name="txn_date" class="form-control" required value="{{ expense.txn_date if expense else '' }}">
                        </div>

                        <div class="col-12">
                            <label class="form-label text-muted small fw-bold">Merchant / Description</label>
                            <input type="text" name="merchant" class="form-control" placeholder="Where did you spend?" value="{{ expense.merchant if expense else '' }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">Category</label>
                            <select name="category" class="form-select">
                                <option value="Uncategorized" {% if expense and expense.category == 'Uncategorized' %}selected{% endif %}>Uncategorized</option>
                                {% for cat in categories %}
                                <option value="{{ cat.name }}" {% if expense and expense.category == cat.name %}selected{% endif %}>{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">Billing Month (YYYY-MM) *</label>
                            <input type="month" name="billing_month" class="form-control" required value="{{ expense.billing_month if expense else '' }}">
                        </div>

                        <div class="col-12">
                            <label class="form-label text-muted small fw-bold">Status</label>
                            <select name="status" class="form-select">
                                <option value="unbilled" {% if expense and expense.status == 'unbilled' %}selected{% endif %}>Unbilled</option>
                                <option value="billed" {% if expense and expense.status == 'billed' %}selected{% endif %}>Billed</option>
                                <option value="paid" {% if expense and expense.status == 'paid' %}selected{% endif %}>Paid</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label text-muted small fw-bold">Raw SMS (Optional)</label>
                            <textarea name="raw_sms" class="form-control" rows="3" placeholder="Original SMS text...">{{ expense.raw_sms if expense and expense.raw_sms else '' }}</textarea>
                        </div>

                    </div>
                    
                    <div class="mt-4 pt-3 border-top">
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                            <i class="bi bi-save me-2"></i> Save Expense
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
